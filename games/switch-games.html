<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaklar | Nintendo Switch</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div id="game-container"></div>

    <script>
        function getGameId() {
            const params = new URLSearchParams(window.location.search);
            return params.get("game");
        }

        function createDownloadRegion(flag, country, links) {
            if (!links || links.length === 0) return "";

            const buttons = links.map(item => {
                const label = typeof item === "string" ? "Download" : item.label;
                const url   = typeof item === "string" ? item : item.url;

                return `
                    <a class="download-button" href="${url}" target="_blank" rel="noopener noreferrer">
                        ${label}
                    </a>
                `;
            }).join("");

            return `
                <div class="download-region">
                    <div class="download-header">
                        <span class="flag">${flag}</span>
                        <h3>${country}</h3>
                    </div>
                    <div class="download-links">
                        ${buttons}
                    </div>
                </div>
            `;
        }

        function loadGame(game) {
            document.title = `Zaklar | ${game.name}`;

            document.getElementById("game-container").innerHTML = `
                <div class="switch-header">
                    <div class="switch-title">
                        <h1>${game.title}</h1>
                    </div>
                    <p>${game.subtitle}</p>
                </div>

                <section class="game-page">
                    <div class="game-page-info">
                        <img
                            class="game-cover"
                            src="${game.cover}"
                            alt="${game.alt}"
                            loading="lazy"
                        >
                        <div class="details">
                            <h2>${game.name}</h2>
                            <p><strong>Release:</strong> ${game.year}</p>
                            <p><strong>Platform:</strong> ${game.platform}</p>
                            <p><strong>Developer:</strong> ${game.developer}</p>
                            <p><strong>Publisher:</strong> ${game.publisher}</p>
                            <p><strong>Genre:</strong> ${game.genre}</p>
                            <p><strong>Tags:</strong> ${game.tags}</p>
                            <p><strong>Age Rating:</strong> ${game.rating}</p>
                        </div>
                    </div>

                    <section class="description">
                        <h2>Synopsis ♡</h2>
                        ${game.synopsis.map(p => `<p>${p}</p>`).join("")}
                    </section>

                    <section class="download">
                        <h2>Download</h2>
                        ${createDownloadRegion("🇯🇵", "Japan", game.downloads.japan)}
                        ${createDownloadRegion("🇺🇸", "USA", game.downloads.usa)}
                    </section>
                </section>
            `;
        }

        function showNotFound() {
            document.title = "Zaklar | Nintendo Switch";

            document.getElementById("game-container").innerHTML = `
                <div class="switch-header">
                    <div class="switch-title">
                        <h1>SWITCH</h1>
                    </div>
                    <p>Game not found</p>
                </div>

                <section class="game-page">
                    <div class="game-page-info">
                        <div class="details">
                            <h2>Game not found</h2>
                            <p>The requested game could not be found.</p>
                        </div>
                    </div>
                </section>
            `;
        }

        async function init() {
            const gameId = getGameId();

            if (!gameId) {
                showNotFound();
                return;
            }

            try {
                const response = await fetch("../data/switch-games.json");

                if (!response.ok) {
                    throw new Error("Failed to load games data");
                }

                const games = await response.json();
                const selectedGame = games.find(g => g.id === gameId);

                if (selectedGame) {
                    loadGame(selectedGame);
                } else {
                    showNotFound();
                }
            } catch (error) {
                console.error(error);
                showNotFound();
            }
        }

        init();
    </script>
</body>
</html>
